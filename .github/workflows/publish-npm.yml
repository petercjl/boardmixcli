name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover:
        description: Recover registry publication for the existing package version
        type: boolean
        default: false
      release:
        description: patch, minor, major, prerelease, or exact semver
        required: true
        default: patch
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run smoke
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [qa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for OIDC
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check --if-present
      - run: npm test --if-present
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish @petercjl/boardmixcli
        if: ${{ !inputs.recover }}
        run: npx --yes --package @petercjl/npm-release-kit@0.1.4 npm-release-kit ci publish --release "${{ inputs.release }}" --tag "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover exact registry publication through OIDC
        if: ${{ inputs.recover }}
        env:
          RELEASE_VERSION: ${{ inputs.release }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const p=JSON.parse(fs.readFileSync('package.json'));
          if(p.version!==process.env.RELEASE_VERSION)throw Error('VERSION_MISMATCH');
          const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name)+'/'+p.version);
          if(r.status===404)execFileSync('npm',['publish','--access','public','--provenance','--tag',process.env.RELEASE_TAG,'--loglevel','notice'],{stdio:'inherit'});
          else if(!r.ok)throw Error('REGISTRY_UNAVAILABLE');
          else console.log('Exact version already public; upload skipped.');
          JS
      - name: Verify public registry version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json'));
          for(let n=0;n<18;n++){
            const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name)+'?verify='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
            const d=await r.json();
            if(d.versions?.[p.version]&&d['dist-tags']?.[process.env.RELEASE_TAG]===p.version){console.log('Verified '+p.name+'@'+p.version);process.exit(0);}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw Error('PUBLIC_REGISTRY_VERIFICATION_FAILED');
          JS
